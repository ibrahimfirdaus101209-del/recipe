<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      text-align: center;
      padding: 60px 20px;
      color: #222;
    }

    .kartu {
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      max-width: 450px;
      margin: 30px auto;
      box-shadow: 0 8px 20px #0002;
    }

    button {
      background: #6558d3;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <h1>Halo, Dunia! 👋</h1>
    <p>Selamat datang di website pertamaku.</p>
    <p>Aku sedang belajar membuat website!</p>
    <button onclick="alert('Yeay! Website-ku berhasil!')">
      Klik Aku!
    </button>
  </div>
</body>
</html>
